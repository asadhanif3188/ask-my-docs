[project]
name = "ask-my-docs"
version = "0.1.0"
description = "Multi-tenant production RAG with citation enforcement and CI-gated evals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "anthropic>=0.40",
    "sentence-transformers>=3.0",   # BGE-M3 embeddings + bge-reranker
    "pypdf>=4.3",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ragas>=0.2",
    "datasets>=3.0",
    # Ragas' judge. It defaults to OpenAI for both LLM and embeddings; we have no
    # OpenAI key and no reason to add a vendor, so the judge is Claude and the
    # embeddings are the local BGE-M3 (evals/run_evals.py::_judge).
    "langchain-anthropic>=0.3",
    # ragas 0.4.3 declares `langchain-community` with no upper bound, and imports
    # langchain_community.chat_models.vertexai *unguarded* at module load. That
    # module is gone in langchain-community 0.4.x, so an unpinned resolve installs
    # a ragas that cannot be imported at all. Nothing in app/ uses langchain — it
    # is purely ragas' transitive dep — so pinning it here is free.
    "langchain-community<0.4",
]
# scripts/fetch_corpus.py only: converts fetched SEC EDGAR HTML filings to PDF
# so they're ingestible by the existing (PDF-only) pipeline.
corpus = [
    "beautifulsoup4>=4.12",
    "reportlab>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
