[project]
name = "ask-my-docs"
version = "0.1.0"
description = "Multi-tenant production RAG with citation enforcement and CI-gated evals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "anthropic>=0.40",
    "sentence-transformers>=3.0",   # BGE-M3 embeddings + bge-reranker
    "pypdf>=4.3",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ragas>=0.2",
    "datasets>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
