name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: askmydocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d askmydocs"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/askmydocs
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run python -m scripts.migrate
      - run: uv run pytest -q

  eval-gate:
    # Gate on the golden set whenever retrieval/generation/prompt config changes.
    # Requires LLM_API_KEY secret; skipped on forks.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs: lint-test
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      # TODO(phase2): seed eval org + corpus, then enforce:
      # - run: uv run python -m evals.run_evals
      - run: echo "eval gate placeholder — enable once golden set is filled"
