name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: askmydocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d askmydocs"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/askmydocs
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run python -m scripts.migrate
      - run: uv run pytest -q

  eval-gate:
    # Gate on the CI golden subset whenever retrieval/generation/prompt config changes.
    # Requires LLM_API_KEY secret; skipped on forks.
    #
    # The CI golden set contains 15 cases whose source documents are in fixtures/ci_corpus/.
    # The full 50-case golden_set.jsonl is reserved for local/pre-release evaluation.
    # See README and docs/DEPLOYMENT.md for details on the split.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs: lint-test
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: askmydocs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d askmydocs"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/askmydocs
      JWT_SECRET: ci-only-secret
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Check for LLM_API_KEY
        id: check-key
        run: |
          if [ -z "${{ env.LLM_API_KEY }}" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bge-m3
          restore-keys: ${{ runner.os }}-hf-
      - run: uv sync --extra dev
      - name: Skip eval due to missing LLM_API_KEY
        if: steps.check-key.outputs.has_key == 'false'
        run: |
          echo "::warning::LLM_API_KEY secret not available (fork PR?). Eval gate skipped."
          echo "To run evals locally with your own key: uv run python -m scripts.ci_local"
          exit 0
      - name: Seed eval org and corpus
        if: steps.check-key.outputs.has_key == 'true'
        run: |
          uv run python << 'EOF'
          import asyncio
          from evals.seed_eval_org import seed_eval_org
          from pathlib import Path
          asyncio.run(seed_eval_org(corpus_dir=Path('fixtures/ci_corpus')))
          EOF
      - name: Run evals (CI golden set)
        if: steps.check-key.outputs.has_key == 'true'
        run: uv run python -m evals.run_evals --golden-set ci
        env:
          HF_HOME: ~/.cache/huggingface

  build:
    # Verify the app builds; run after evals pass.
    runs-on: ubuntu-latest
    needs: [lint-test, eval-gate]
    if: always() && needs.lint-test.result == 'success' && (needs.eval-gate.result == 'success' || needs.eval-gate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - name: Build check
        run: uv run python -c "from app.main import app; print('Build OK')"
